    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #F2EFE9;
        z-index: 99999;
        font-family: 'Archivo Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.18s ease;
      }
      #boot.boot-dark { background: #0C1222; }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      #boot-inner { display: grid; justify-items: center; gap: 28px; width: min(340px, 100%); }
      #boot-plaque {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 30px 18px;
        border-radius: 10px;
        background: #1E3F8A;
        color: #FFFFFF;
        box-shadow: inset 0 0 0 6px #1E3F8A, inset 0 0 0 8.5px rgba(255, 255, 255, 0.9);
        font-stretch: 75%;
        text-transform: uppercase;
        line-height: 1;
      }
      #boot.boot-dark #boot-plaque { background: #22397A; box-shadow: inset 0 0 0 6px #22397A, inset 0 0 0 8.5px rgba(255, 255, 255, 0.9); }
      #boot-small { font-size: 15px; font-weight: 600; letter-spacing: 0.3em; }
      #boot-big { font-size: 44px; font-weight: 800; letter-spacing: 0.03em; margin-top: 4px; }
      #boot-strip {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #243056;
        background: #10172B;
      }
      #boot-status { flex: 1; font-size: 16px; font-weight: 600; font-stretch: 88%; color: #FFFFFF; perspective: 400px; }
      #boot-status.boot-flip { animation: boot-flap 240ms cubic-bezier(0.4, 0, 0.2, 1); }
      #boot-pct { font-size: 14px; font-weight: 700; font-stretch: 75%; color: #F2B33D; font-variant-numeric: tabular-nums; }
      #boot-track { width: 100%; height: 3px; margin-top: -18px; border-radius: 2px; background: #E8E3D9; overflow: hidden; }
      #boot.boot-dark #boot-track { background: #0A0F1C; }
      #boot-fill { height: 100%; width: 5%; background: #1E3F8A; transition: width 0.5s cubic-bezier(0.2, 0, 0, 1); }
      #boot.boot-dark #boot-fill { background: #8FAAE6; }
      @keyframes boot-flap { 50% { transform: rotateX(-88deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-status.boot-flip { animation: none; }
        #boot-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status">
      <div id="boot-inner">
        <span id="boot-plaque" role="img" aria-label="Bonjour Survival"><span id="boot-small">Bonjour</span><span id="boot-big">Survival</span></span>
        <div id="boot-strip"><span id="boot-status">Opening the station…</span><span id="boot-pct">5%</span></div>
        <div id="boot-track" aria-hidden="true"><div id="boot-fill"></div></div>
      </div>
    </div>

    <script>
      (function () {
        var boot = document.getElementById('boot');
        var fill = document.getElementById('boot-fill');
        var statusEl = document.getElementById('boot-status');
        var pctEl = document.getElementById('boot-pct');
        var pct = 5;

        var stored = {};
        try { stored = JSON.parse(localStorage.getItem('french-progress') || '{}'); } catch (_) {}
        var state = stored.state || {};
        var dark = !!state.darkMode;

        if (dark) boot.classList.add('boot-dark');

        function advance(p, msg) {
          if (p > pct) {
            pct = p;
            fill.style.width = pct + '%';
            pctEl.textContent = pct + '%';
          }
          if (msg && msg !== statusEl.textContent) {
            statusEl.classList.remove('boot-flip');
            void statusEl.offsetWidth;
            statusEl.classList.add('boot-flip');
            statusEl.textContent = msg;
          }
        }

        var STEPS = [
          { key: 'rolldown-runtime', label: 'Opening the station…',   pct: 10 },
          { key: 'react-vendor',     label: 'Loading React…',          pct: 45 },
          { key: 'motion',           label: 'Loading animations…',     pct: 75 },
          { key: 'ui-',              label: 'Loading the signs…',       pct: 83 },
          { key: 'index-',           label: 'Loading the lines…',    pct: 94 },
        ];
        var seen = {};

        if (window.PerformanceObserver) {
          try {
            var obs = new PerformanceObserver(function (list) {
              list.getEntries().forEach(function (e) {
                var url = e.name;
                STEPS.forEach(function (step) {
                  if (!seen[step.key] && url.indexOf(step.key) !== -1) {
                    seen[step.key] = true;
                    advance(step.pct, step.label);
                  }
                });
              });
            });
            obs.observe({ type: 'resource', buffered: true });
          } catch (_) {}
        }

        window.__bootReady = function () {
          advance(100, 'Prêt\u202F!');
          setTimeout(function () {
            boot.classList.add('boot-out');
            setTimeout(function () { boot.remove(); }, 200);
          }, 150);
        };
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

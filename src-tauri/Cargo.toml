[package]
name = "bonjour-survival"
version = "0.1.0"
description = "Desktop wrapper for Oh Non! Le French Website"
authors = ["Earth1283"]
license = ""
repository = "https://github.com/Earth1283/french-website"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bonjour_survival_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

name: Build Desktop App (Linux & Windows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Finds the draft release for this app version, or creates it. Both desktop
  # workflows run this under one shared concurrency group, so only one of them
  # can create the draft; the other waits and then reuses it.
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-release-draft
      cancel-in-progress: false
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Find or create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: |
            Desktop build of Bonjour Survival. Download the asset matching your platform:

            - macOS Apple Silicon: `.dmg` (aarch64)
            - macOS Intel: `.dmg` (x64)
            - Windows: `.msi` or `-setup.exe`
            - Linux: `.AppImage`, `.deb`, or `.rpm` (amd64/arm64)
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="app-v$VERSION"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Bonjour Survival v$VERSION" \
              -f body="$RELEASE_BODY" \
              -F draft=true -F prerelease=false --jq .id)
            echo "Created draft release $TAG ($ID)"
          else
            echo "Reusing draft release $TAG ($ID)"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - name: linux-amd64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm # native arm64 hosted runner, free on public repos
            rust-target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}

      # webkit2gtk + friends are needed to build the Tauri webview shell on Linux.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential

      - name: Install frontend dependencies
        run: npm ci

      # Only runs when the WINDOWS_CERTIFICATE secret is configured. Imports the
      # cert into the user store and writes its thumbprint into tauri.conf.json
      # so the bundler picks it up automatically — no manual thumbprint entry.
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item -Recurse -Force certificate

          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([PSCustomObject]@{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm       = "sha256"
            timestampUrl          = "http://timestamp.digicert.com"
          }) -Force
          $conf | ConvertTo-Json -Depth 32 | Set-Content $confPath

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: powers the ambient Landing / Focus backdrops (see deploy.yml).
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --target ${{ matrix.rust-target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bonjour-survival-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**
          if-no-files-found: error

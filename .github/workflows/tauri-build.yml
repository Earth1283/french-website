name: Build Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest # Apple Silicon
            rust-target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15-intel # last GitHub-hosted Intel macOS image
            rust-target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - name: linux-amd64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm # native arm64 hosted runner, free on public repos
            rust-target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}

      # webkit2gtk + friends are needed to build the Tauri webview shell on Linux.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            build-essential

      - name: Install frontend dependencies
        run: npm ci

      # Only runs when the APPLE_CERTIFICATE secret is configured — until then,
      # builds are produced unsigned (see README for how to add signing).
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      # Only runs when the WINDOWS_CERTIFICATE secret is configured. Imports the
      # cert into the user store and writes its thumbprint into tauri.conf.json
      # so the bundler picks it up automatically — no manual thumbprint entry.
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item -Recurse -Force certificate

          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([PSCustomObject]@{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm       = "sha256"
            timestampUrl          = "http://timestamp.digicert.com"
          }) -Force
          $conf | ConvertTo-Json -Depth 32 | Set-Content $confPath

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: powers the ambient Landing / Focus backdrops (see deploy.yml).
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
          # macOS signing + notarization — no-ops unless the secrets above are set.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Bonjour Survival v__VERSION__'
          releaseBody: |
            Desktop build of Bonjour Survival. Download the asset matching your platform:

            - macOS Apple Silicon: `.dmg` (aarch64)
            - macOS Intel: `.dmg` (x64)
            - Windows: `.msi` or `-setup.exe`
            - Linux: `.AppImage`, `.deb`, or `.rpm` (amd64/arm64)
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bonjour-survival-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**
          if-no-files-found: error
